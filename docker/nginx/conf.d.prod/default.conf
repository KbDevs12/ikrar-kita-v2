# Production reverse proxy.
#
# Replace `your-domain.id` with the real domain before deploying.
# SSL certs are expected at /etc/nginx/ssl/fullchain.pem and privkey.pem.
# Generated via certbot or your provider of choice.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.id www.your-domain.id;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.id www.your-domain.id;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn conn_per_ip 50;

    # ── Auth endpoints - tighter rate limit ──────────────────────────────────
    location ~ ^/api/auth/(login|register|resend-verification) {
        limit_req zone=req_auth burst=10 nodelay;
        proxy_pass http://nextjs_upstream;
        include /etc/nginx/conf.d/_proxy_params.conf;
    }

    # ── Tripay webhook - separate rate limit, no caching ─────────────────────
    location /api/webhooks/tripay {
        limit_req zone=req_webhook burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        include /etc/nginx/conf.d/_proxy_params.conf;
        # Forward raw body intact - signature verification needs unmodified bytes
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ── Static media via MinIO ──────────────────────────────────────────────
    location /media/ {
        rewrite ^/media/(.*)$ /wedding-media/$1 break;
        proxy_pass http://minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── Default - Next.js ────────────────────────────────────────────────────
    location / {
        limit_req zone=req_general burst=60 nodelay;
        proxy_pass http://nextjs_upstream;
        include /etc/nginx/conf.d/_proxy_params.conf;
    }
}
