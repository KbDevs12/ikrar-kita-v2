# Local development reverse proxy.
#
# Routes:
#   /         -> Next.js running on the host (host.docker.internal:3000)
#   /media/   -> MinIO bucket (rewrites to /<bucket>/...)
#
# In production use docker/nginx/conf.d.prod/default.conf instead.

server {
    listen 80;
    server_name localhost;

    # Default to Next.js
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Media served from MinIO. Caching with long max-age because we use hashed
    # filenames, but invalidation can be done by changing the filename on
    # upload (see media service).
    location /media/ {
        rewrite ^/media/(.*)$ /wedding-media/$1 break;
        proxy_pass http://minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # MinIO sometimes returns chunked - disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Cache aggressively - filenames are content-hashed
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
