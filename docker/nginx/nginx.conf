user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging - keep query string out of access log to avoid leaking ?to= names
    log_format main_safe
        '$remote_addr - $remote_user [$time_local] '
        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main_safe;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 8M; # hard ceiling - app enforces 2-3MB per file
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml application/xml+rss
        image/svg+xml font/woff font/woff2;

    # ── Security headers (also set by Next, kept here as defence in depth) ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Rate limit zones ─────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=req_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=req_auth:10m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=req_webhook:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstreams ────────────────────────────────────────────────────────────
    upstream nextjs_upstream {
        server app:3000;
        keepalive 32;
    }

    upstream minio_upstream {
        server minio:9000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
