# Production stack for self-hosted VPS deployment.
#
# Usage on VPS:
#   1. Copy .env.example to .env and fill all required values.
#   2. Build and run:
#      docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   3. Run migrations once after first boot:
#      docker compose exec app pnpm db:migrate:deploy
#      docker compose exec app pnpm db:seed
#
# This file overlays docker-compose.yml. Differences in production:
#   - app service is built from local Dockerfile and runs the standalone bundle
#   - postgres / redis / minio are NOT exposed to the host
#   - nginx is the only public-facing service (80/443)

name: ikrar-kita

services:
  postgres:
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wedding_saas}"]

  redis:
    ports: !reset []

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikrar-kita-app:latest
    container_name: ikrar-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-wedding-media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [ikrar-net]

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d.prod:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - minio
