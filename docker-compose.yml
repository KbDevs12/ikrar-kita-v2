# Base infrastructure for local development.
#
# Usage:
#   docker compose up -d                # postgres, redis, minio, nginx for dev
#   pnpm dev                            # run Next.js on host, talking to those
#
# Use docker-compose.prod.yml for full self-hosted production stack.

name: ikrar-kita

services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    container_name: ikrar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wedding_saas}
      # Trust local connections from inside the docker network only.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wedding_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ikrar-net]

  redis:
    image: redis:7-alpine
    container_name: ikrar-redis
    restart: unless-stopped
    mem_limit: 256m
    # Bind to all in-network only; not exposed to host by default in production.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - "allkeys-lru"
      - --requirepass
      - "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ikrar-net]

  minio:
    image: minio/minio:latest
    mem_limit: 256m
    container_name: ikrar-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    ports:
      - "${MINIO_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [ikrar-net]

  # One-shot job that creates the bucket and applies a sane public-read policy
  # for media files. Idempotent - safe to run on every up.
  minio-init:
    image: minio/mc:latest
    container_name: ikrar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb -p local/${MINIO_BUCKET:-wedding-media} || true &&
      mc anonymous set download local/${MINIO_BUCKET:-wedding-media} &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET:-wedding-media}'
      "
    networks: [ikrar-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: ikrar-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - minio
    networks: [ikrar-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  ikrar-net:
    driver: bridge
